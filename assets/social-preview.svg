<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Sprintest — AI-native QA course">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0e1330"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sp-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="sp-icon-glow" cx="0.5" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <ellipse cx="640" cy="250" rx="520" ry="360" fill="url(#sp-glow)"/>

  <!-- mark, centered -->
  <g transform="translate(530 58) scale(0.43)">
    <rect width="512" height="512" rx="116" fill="url(#sp-icon-bg)"/>
    <rect width="512" height="512" rx="116" fill="url(#sp-icon-glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round">
      <line x1="60" y1="196" x2="176" y2="196"/>
      <line x1="42" y1="244" x2="184" y2="244"/>
      <line x1="60" y1="292" x2="164" y2="292"/>
    </g>
    <circle cx="292" cy="244" r="112" fill="url(#sp-glass)"/>
    <circle cx="292" cy="244" r="112" fill="none" stroke="#ffffff" stroke-width="34"/>
    <line x1="372" y1="324" x2="434" y2="386" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
    <path d="M242 246 L280 286 L348 196" fill="none" stroke="#ffffff" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M430 84 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11 z" fill="#a5f3fc"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="372" text-anchor="middle"
        font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"
        font-size="116" font-weight="700" letter-spacing="-2" fill="#ffffff">Sprintest</text>
  <rect x="520" y="398" width="240" height="7" rx="3.5" fill="url(#sp-rule)"/>
  <text x="640" y="452" text-anchor="middle"
        font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"
        font-size="32" fill="#94a3b8">AI-native QA course, delivered as an installable agent skill</text>

  <!-- skill pills -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"
     font-size="26" fill="#c7d2fe" text-anchor="middle">
    <rect x="238" y="502" width="188" height="56" rx="28" fill="#6366f1" fill-opacity="0.16" stroke="#6366f1" stroke-opacity="0.45"/>
    <text x="332" y="538">Manual QA</text>
    <rect x="440" y="502" width="176" height="56" rx="28" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <text x="528" y="538">API &amp; SQL</text>
    <rect x="630" y="502" width="186" height="56" rx="28" fill="#06b6d4" fill-opacity="0.16" stroke="#06b6d4" stroke-opacity="0.45"/>
    <text x="723" y="538">Playwright</text>
    <rect x="830" y="502" width="212" height="56" rx="28" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="936" y="538">AI-assisted</text>
  </g>

  <text x="640" y="606" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace"
        font-size="27" fill="#64748b">npx skills add shatxlab/sprintest</text>
</svg>
